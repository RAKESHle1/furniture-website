<!DOCTYPE html>
<html>

<head>
    <title>Backend Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .test-section {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }

        button {
            background: #4A3B32;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #3a2f28;
        }

        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: monospace;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h1>🔍 Backend Connection Test</h1>

    <div class="test-section">
        <h2>Step 1: Enter Your Backend URL</h2>
        <input type="text" id="backendUrl" placeholder="https://your-backend.vercel.app" value="" />
        <small>Find this in your Vercel Dashboard → Backend Project → Domains</small>
    </div>

    <div class="test-section">
        <h2>Step 2: Test Backend Connection</h2>
        <button onclick="testBackend()">Test Connection</button>
        <div id="testResult"></div>
    </div>

    <div class="test-section">
        <h2>Step 3: Test Booking API</h2>
        <button onclick="testBooking()">Test Booking Endpoint</button>
        <div id="bookingResult"></div>
    </div>

    <script>
        function getBackendUrl() {
            const url = document.getElementById('backendUrl').value.trim();
            if (!url) {
                alert('Please enter your backend URL first!');
                return null;
            }
            return url.endsWith('/') ? url.slice(0, -1) : url;
        }

        async function testBackend() {
            const backendUrl = getBackendUrl();
            if (!backendUrl) return;

            const resultDiv = document.getElementById('testResult');
            resultDiv.innerHTML = '<p>Testing connection...</p>';

            try {
                const response = await fetch(backendUrl, { method: 'GET' });
                const text = await response.text();

                resultDiv.innerHTML = `
                    <div class="result ${response.ok ? 'success' : 'error'}">
                        <strong>Status:</strong> ${response.status} ${response.statusText}
                        <br><strong>Response:</strong> ${text || 'Empty response'}
                        <br><br>
                        ${response.ok ? '✅ Backend is running!' : '❌ Backend returned an error'}
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <strong>❌ Connection Failed</strong>
                        <br><br>Error: ${error.message}
                        <br><br>
                        <strong>Possible Issues:</strong>
                        <br>1. Backend URL is incorrect
                        <br>2. Backend is not deployed
                        <br>3. CORS is blocking the request
                    </div>
                `;
            }
        }

        async function testBooking() {
            const backendUrl = getBackendUrl();
            if (!backendUrl) return;

            const resultDiv = document.getElementById('bookingResult');
            resultDiv.innerHTML = '<p>Testing booking endpoint...</p>';

            const testData = {
                name: "Test User",
                location: "Hyderabad",
                phone: "9999999999",
                email: "test@example.com",
                product: {
                    name: "Test Product",
                    price: "₹50,000",
                    image: "https://via.placeholder.com/150"
                }
            };

            try {
                const response = await fetch(`${backendUrl}/api/book`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testData)
                });

                const contentType = response.headers.get('content-type');
                let data;

                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    data = await response.text();
                }

                resultDiv.innerHTML = `
                    <div class="result ${response.ok ? 'success' : 'error'}">
                        <strong>Status:</strong> ${response.status} ${response.statusText}
                        <br><strong>Content-Type:</strong> ${contentType}
                        <br><strong>Response:</strong><br>${JSON.stringify(data, null, 2)}
                        <br><br>
                        ${response.ok ? '✅ Booking API is working!' : '❌ Booking API returned an error'}
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <strong>❌ API Test Failed</strong>
                        <br><br>Error: ${error.message}
                        <br><br>
                        <strong>Possible Issues:</strong>
                        <br>1. Backend endpoint /api/book doesn't exist
                        <br>2. Server returned invalid JSON
                        <br>3. Network error
                    </div>
                `;
            }
        }
    </script>
</body>

</html>
